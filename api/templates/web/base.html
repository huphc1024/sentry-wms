<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sơn Lộc WMS Web{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f3ed;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #8e2716;
      --primary-2: #a6321b;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .topbar {
      height: 56px;
      background: #2f2924;
      color: #fdf4e3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #3e3730;
    }
    .brand { font-weight: 700; letter-spacing: 0.3px; }
    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .btn {
      border: none;
      background: #ece7df;
      color: #2b2b2b;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #e2dbd1; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-2); }
    .input, select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      background: #fff;
    }
    .muted { color: var(--muted); }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
